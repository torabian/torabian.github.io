<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fireback</title>
    <!--
      Prevents a white flash on load for OS-dark-mode users: this is inline
      so the browser applies it immediately from the HTML response itself,
      before the app's own (network-fetched) CSS or the theme-class script
      at the bottom of <body> have had a chance to run. Same dark chrome
      color as --dark-theme-root-bg's solid form (L0, "root backdrop" - see
      packages/styles/apple-family/theme-osx-dark-override.css's palette
      comment), so there's no visible color jump once the real stylesheet
      takes over.

      Only handles automatic (OS-driven) dark mode, matching this file's own
      "dark, light, automatic" convention - an explicit light-theme choice
      while the OS is in dark mode isn't accounted for here, since detecting
      that needs localStorage, which isn't readable this early without its
      own (bigger) flash-of-unstyled-content trade-off.
    -->
    <style>
      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: #3b3b3b;
        }
      }
    </style>
    <script type="module" crossorigin src="/fireback/assets/index-DsKSI1Wl.js"></script>
    <link rel="stylesheet" crossorigin href="/fireback/assets/index-BAcEPaCS.css">
  </head>
  <body>
    <div id="root"></div>
  </body>

  <script>
    function getOS() {
      let userAgent = window.navigator.userAgent,
        platform = window.navigator.platform,
        macosPlatforms = ["Macintosh", "MacIntel", "MacPPC", "Mac68K"],
        windowsPlatforms = ["Win32", "Win64", "Windows", "WinCE"],
        iosPlatforms = ["iPhone", "iPad", "iPod"],
        os = "mac";

      if (macosPlatforms.indexOf(platform) !== -1) {
        os = "mac";
      } else if (iosPlatforms.indexOf(platform) !== -1) {
        os = "ios";
      } else if (windowsPlatforms.indexOf(platform) !== -1) {
        os = "windows";
      } else if (/Android/.test(userAgent)) {
        os = "android";
      } else if (!os && /Linux/.test(platform)) {
        os = "linux";
      } else {
        os = "web";
      }
      return os;
    }

    function loadFont(name, url, weight) {
      return new Promise((resolve, reject) => {
        const myFont = new FontFace(name, `url(${url})`);
        if (weight) myFont.weight = weight;
        myFont
          .load()
          .then(() => {
            document.fonts.add(myFont);
            const el = document.createElement("DIV");
            el.style.fontFamily = name;
            resolve(true);
          })
          .catch((err) => {
            console.log(err);
          });
      });
    }

    if ("en,fa".includes("fa")) {
      loadFont("iransans", "/fireback/fonts/irs/irs.ttf");
    }

    var theme = localStorage.getItem("ui_theme") || "mac-theme";
    for (let th of theme.split(" ")) {
      document.getElementsByTagName("body")[0].classList.add(th);
    }
  </script>
</html>
